<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="HAMUSATA Lite">
<meta name="apple-mobile-web-app-title" content="HAMUSATA Lite">
<meta name="description" content="hamusata サイト軽量版">
<meta name="keywords" content="hamusata,hamusata.f5.si,軽量版,Lite,低通信量,PWA">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://www.lite.hamusata.f5.si/">
<meta property="og:type" content="website">
<meta property="og:title" content="HAMUSATA Lite | 軽量版">
<meta property="og:description" content="hamusata サイト軽量版">
<meta property="og:url" content="https://www.lite.hamusata.f5.si/">
<meta property="og:site_name" content="HAMUSATA Lite">
<title>HAMUSATA Lite | 軽量版</title>
<style>
:root {
    --bg: #121212;
    --surface: #1f1f1f;
    --surface-2: #2a2a2a;
    --text: #ddd;
    --muted: #aaa;
    --border: #3a3a3a;
    --accent: #6ea8ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Potta One", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    scroll-behavior: smooth;
}

main {
    width: min(100%, 1000px);
    margin: 0 auto;
}

header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    text-align: center;
    padding: 0.9rem 0.8rem;
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(18, 18, 18, 0.92);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}

.text-center {
    text-align: center;
}

header a {
    color: var(--text) !important;
    text-decoration: none;
    font-weight: 600;
    margin: 0;
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    transition: background 0.2s ease, border-color 0.2s ease;
}

header a:hover,
header a:focus-visible {
    background: rgba(255, 255, 255, 0.08);
    border-color: #606060;
}

header a:visited {
    color: var(--text) !important;
}

.banner-link {
    display: block;
    color: #ddd !important;
    text-decoration: none;
}

.banner-link:visited {
    color: #ddd !important;
}

.banner-link img {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    border: none;
}

section {
    max-width: 1000px;
    margin: 2rem auto;
    padding: 0 1rem;
}

section h2 {
    font-size: 1.8rem;
    margin-bottom: 1rem;
    text-align: center;
    color: var(--muted);
}

.works {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
}

.work-card {
    background: linear-gradient(180deg, #202020, #1a1a1a);
    padding: 1rem;
    border-radius: 8px;
    text-align: center;
    border: 1px solid var(--border);
    transition: transform 0.2s ease, border-color 0.2s ease;
}

.work-card:hover,
.work-card:focus-within {
    transform: translateY(-2px);
    border-color: #5a5a5a;
}

.work-card img {
    width: 80px;
    height: 80px;
    margin-bottom: 0.5rem;
    border-radius: 50%;
    border: 2px solid #555;
}

.work-card a {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.5rem 1rem;
    background: var(--surface-2);
    color: var(--text) !important;
    text-decoration: none;
    border-radius: 8px;
    border: 1px solid #505050;
}

.work-card a:visited {
    color: #ddd !important;
}

.work-card a:hover {
    background: #4a4a4a;
    color: #fff;
}

footer {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--muted);
    font-size: 0.9rem;
}

footer a {
    color: #888 !important;
    text-decoration: underline;
}

@media (max-width: 768px) {
    .works {
        grid-template-columns: 1fr;
    }

    section h2 {
        font-size: 1.5rem;
    }
}

#showImages {
    display: block;
    margin: 1rem auto;
    padding: 0.6rem 1rem;
    cursor: pointer;
    background: #252525;
    color: #e6e6e6;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
}

#showImages:hover,
#showImages:focus-visible {
    background: #404040;
}

@media (max-width: 480px) {
    section {
        margin: 1.25rem auto;
    }

    .work-card a,
    #showImages {
        width: 100%;
    }
}

@media (prefers-reduced-motion: reduce) {
    * {
        scroll-behavior: auto !important;
        transition: none !important;
    }
}
</style>

<link id="faviconLink" rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">

<body>

<header>
    <a href="https://www.hamusata.f5.si">通常版</a>
    <a id="liteLink" href="/s/">最小版</a>
</header>

<main>

<a href="https://hamusata.f5.si" class="banner-link" aria-label="HAMUSATA ホームへ移動">
    <img id="bannerImg" alt="hamusata home banner">
</a>

<button id="showImages">画像を表示 / 非表示</button>

<section id="profile">
    <h2>自己紹介</h2>
    <p class="text-center">こんにちは、hamusataです。webサイトを作ったりネットをしてるネットの海の住民。</p>
    <p class="text-center">ハムスターが好きな人。</p>
    <p class="text-center">ネットの海でプログラミングしたりネットしたりして過ごしてます。</p>
</section>

<section id="links">
    <h2>リンク集</h2>
    <div class="works" id="worksContainer"></div>
</section>

<footer>
    &copy; <span id="year"></span> HAMUSATA – Lite版ホームページ
</footer>

</main>

<script src="script.js"></script>

</body>
</html>
