<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMUSATA – 軽量版</title>

<link rel="icon" href="https://hamusata.f5.si/icon.png" type="image/png">
<link rel="apple-touch-icon" href="https://hamusata.f5.si/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Potta+One&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Potta One', sans-serif; }
  body { min-height:100vh; background:#121212; color:#ddd; line-height:1.6; scroll-behavior:smooth; }

  header {
    position: sticky;
    top:0;
    width: 100%;
    background:#121212;
    text-align:center;
    padding:8px 0;
    z-index:999;
  }
  .banner-link img { 
    width: min(100%, 512px); 
    max-height: 120px; 
    object-fit: contain; 
    border-radius:8px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); 
    background:#222;
  }

  .fixed-main-link {
    position: sticky;
    top: 130px;
    background: #1a1a1a;
    text-align:center;
    padding:6px 0;
    z-index:998;
    border-bottom:1px solid #333;
  }
  .fixed-main-link a { color:#4da6ff; text-decoration:none; font-weight:600; font-size:0.95rem; }

  section { max-width: 900px; margin:3rem auto; padding:0 1rem; }
  section h2 { text-align:center; margin-bottom:1.5rem; font-size:1.8rem; color:#aaa; }

  .works { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:1.5rem; }
  .work-card {
    display:block;
    background:#1f1f1f;
    color:#ddd;
    text-decoration:none;
    padding:1.2rem;
    border-radius:12px;
    text-align:center;
    transition:0.3s;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
  }
  .work-card:hover { transform:translateY(-3px); box-shadow:0 12px 24px rgba(0,0,0,0.6); }
  .work-card h3 { margin-bottom:0.5rem; }
  .work-card p { font-size:0.9rem; color:#ccc; }

  footer { text-align:center; padding:2rem 1rem; color:#aaa; font-size:0.85rem; }
  footer a { color:#888; text-decoration:underline; }

  @media(max-width:768px){
    section h2 { font-size:1.5rem; }
    .works { grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <a href="https://hamusata.f5.si" class="banner-link" aria-label="HAMUSATA ホームへ移動">
    <img src="https://m-lite.hamusata.f5.si/banner_icon_hamusata.png" alt="hamusata home banner" width="512" height="154" loading="lazy" decoding="async">
  </a>
</header>

<div class="fixed-main-link">
  <a href="https://hamusata.f5.si">通常版を開く</a>
</div>

<section id="links">
  <h2>リンク集</h2>
  <div class="works">
    <a href="https://hamuzon.github.io" class="work-card">
      <h3>hamuzon.github.io</h3>
      <p>GitHub Pages 版 hamuzon ホームページ</p>
    </a>
    <a href="https://home.hamusata.f5.si" class="work-card">
      <h3>home.hamusata.f5.si</h3>
      <p>HAMUSATAのホーム、各種作品・リンク集の入口</p>
    </a>
    <a href="https://www.link-s.f5.si" class="work-card">
      <h3>www.link-s.f5.si</h3>
      <p>link-s.f5.si 系列作品のメインリンク</p>
    </a>
  </div>
</section>

<footer>
  &copy; <span id="year"></span> <a href="https://github.com/hamuzon">@hamuzon / @hamusata</a> – All rights reserved.
</footer>

<script>
  // 年自動更新
  const baseYear = 2025;
  const currentYear = new Date().getFullYear();
  document.getElementById("year").textContent =
    currentYear > baseYear ? `${baseYear}~${currentYear}` : `${baseYear}`;

  // PC/スマホリダイレクト (軽量版用)
  function checkLiteRedirect() {
    const host = window.location.host;
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 768;
    if (host !== 'm-lite.hamusata.f5.si' && host !== 'lite.hamusata.f5.si') return;
    const target = isMobile ? 'https://m-lite.hamusata.f5.si' : 'https://lite.hamusata.f5.si';
    if (window.location.href !== target) window.location.href = target;
  }
  window.addEventListener('load', checkLiteRedirect);
  window.addEventListener('resize', checkLiteRedirect);
  window.addEventListener('orientationchange', checkLiteRedirect);
</script>

</body>
</html>
