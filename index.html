<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMUSATA – Lite</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: #121212;
        color: #ddd;
        font-family: 'Potta One', sans-serif;
        line-height: 1.6;
        scroll-behavior: smooth;
    }
    header {
        text-align: center;
        padding: 1rem 0;
        position: sticky;
        top: 0;
        background: #121212;
        z-index: 1000;
    }
    header a {
        color: #ddd;
        text-decoration: none;
        font-weight: bold;
        margin: 0 0.5rem;
    }
    .banner-link img {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        height: auto;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    }
    section {
        max-width: 1000px;
        margin: 2rem auto;
        padding: 0 1rem;
    }
    section h2 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
        text-align: center;
        color: #aaa;
    }
    .works {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
    }
    .work-card {
        background: #1f1f1f;
        padding: 1rem;
        border-radius: 8px;
        text-align: center;
        transition: 0.3s;
    }
    .work-card img {
        width: 80px;
        height: 80px;
        margin-bottom: 0.5rem;
        border-radius: 50%;
        border: 2px solid #555;
        object-fit: contain;
    }
    .work-card a {
        display: inline-block;
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        background: #444;
        color: #ddd;
        text-decoration: none;
        border-radius: 8px;
    }
    .work-card a:hover {
        background: #555;
        color: #fff;
    }
    footer {
        text-align: center;
        padding: 2rem 1rem;
        color: #aaa;
        font-size: 0.9rem;
    }
    @media (max-width: 768px) {
        .works {
            grid-template-columns: 1fr;
        }
        section h2 {
            font-size: 1.5rem;
        }
    }
    #showImages {
        display: block;
        margin: 1rem auto;
        padding: 0.5rem 1rem;
        cursor: pointer;
    }
</style>
</head>
<body>

<header>
    <a href="https://www.lite.hamusata.f5.si">通常版</a>
    <a id="liteLink" href="/s/">最小版</a>
</header>

<a href="https://www.lite.hamusata.f5.si" class="banner-link">
    <img id="bannerImg" alt="hamusata home banner">
</a>

<button id="showImages">画像を表示 / 非表示</button>

<section id="profile">
    <h2>自己紹介</h2>
    <p style="text-align:center;">こんにちは、hamusataです。webサイトを作ったりネットをしてるネットの海の住民。</p>
    <p style="text-align:center;">ハムスターを飼っています。</p>
    <p style="text-align:center;">ネットの海でプログラミングしたりネットしたりして過ごしてます。</p>
</section>

<section id="links">
    <h2>リンク集</h2>
    <div class="works" id="worksContainer"></div>
</section>

<footer>
    &copy; <span id="year"></span> HAMUSATA – Lite版ホームページ
</footer>

<script>
const isMobileDevice = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || window.innerWidth <= 768;

(function() {
    const host = window.location.hostname.toLowerCase();
    const isMobile = isMobileDevice();
    if (isMobile) {
        if (!/^www\.m\.lite\.hamusata\.f5\.si$/.test(host) && !/^m\.lite\.hamusata\.f5\.si$/.test(host)) {
            window.location.replace(window.location.href.replace(host, 'www.m.lite.hamusata.f5.si'));
        }
    } else {
        if (!/^www\.lite\.hamusata\.f5\.si$/.test(host) && !/^lite\.hamusata\.f5\.si$/.test(host)) {
            window.location.replace(window.location.href.replace(host, 'lite.hamusata.f5.si'));
        }
    }
})();

const loadImageCached = async (fileName) => {
    const cached = localStorage.getItem(fileName);
    if (cached) return cached;
    try {
        const response = await fetch(`https://hamusata.f5.si/${fileName}`);
        const blob = await response.blob();
        const reader = new FileReader();
        return new Promise(resolve => {
            reader.onloadend = () => {
                const dataURL = reader.result;
                localStorage.setItem(fileName, dataURL);
                resolve(dataURL);
            };
            reader.readAsDataURL(blob);
        });
    } catch {
        return '';
    }
};

const works = [
    { title: 'hamuzon.github.io', link: 'https://hamuzon.github.io', imgFileName: 'icon.svg' },
    { title: 'home.hamusata.f5.si', link: 'https://home.hamusata.f5.si', imgFileName: 'icon.svg' },
    { title: 'www.link-s.f5.si', link: 'https://www.link-s.f5.si/', imgFileName: 'icon.svg' }
];

let imagesShown = localStorage.getItem('imagesShown') === 'true';

function generateWorkCards() {
    const container = document.getElementById('worksContainer');
    container.innerHTML = '';
    works.forEach(work => {
        const card = document.createElement('div');
        card.className = 'work-card';
        card.dataset.filename = work.imgFileName;
        card.innerHTML = `<h3>${work.title}</h3><a href="${work.link}" target="_blank">見る / View</a>`;
        container.appendChild(card);
    });
}

async function setBannerImage(show) {
    const banner = document.getElementById('bannerImg');
    if (show) {
        const url = await loadImageCached('banner_icon_hamusata.png');
        if (url) banner.src = url;
    } else {
        banner.src = '';
    }
}

async function toggleWorkImages(show) {
    const cards = document.querySelectorAll('.work-card');
    for (const card of cards) {
        const fileName = card.dataset.filename;
        if (!fileName) continue;
        let img = card.querySelector('img');
        if (show) {
            if (!img) {
                img = document.createElement('img');
                img.alt = card.querySelector('h3').textContent;
                img.loading = 'lazy';
                card.prepend(img);
            }
            if (!img.src) img.src = await loadImageCached(fileName);
            img.style.display = '';
        } else if (img) {
            img.style.display = 'none';
        }
    }
}

async function updateImages() {
    await setBannerImage(imagesShown);
    await toggleWorkImages(imagesShown);
}

function updateYear() {
    const baseYear = 2025;
    const currentYear = new Date().getFullYear();
    document.getElementById('year').textContent = currentYear > baseYear ? `${baseYear}~${currentYear}` : `${baseYear}`;
}

document.getElementById('showImages').addEventListener('click', async () => {
    imagesShown = !imagesShown;
    localStorage.setItem('imagesShown', imagesShown);
    await updateImages();
});

document.addEventListener('DOMContentLoaded', async () => {
    generateWorkCards();
    updateYear();
    await updateImages();
});
</script>

</body>
</html>
