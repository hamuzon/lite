<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMUSATA – Lite版ホームページ</title>

<link rel="icon" href="https://hamusata.f5.si/icon.svg" type="image/svg+xml">
<link rel="icon" href="https://hamusata.f5.si/icon.png" type="image/png">

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Potta One', sans-serif; }
body { min-height:100vh; background:#121212; color:#ddd; line-height:1.6; scroll-behavior:smooth; }

/* ヘッダー・バナー */
header { text-align:center; padding:1rem 0; }
#bannerContainer img { display:block; max-width:100%; height:auto; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.18); }
#toggleBanner { margin-top:0.5rem; padding:0.5rem 1rem; cursor:pointer; background:#444; color:#ddd; border:none; border-radius:6px; transition:0.3s; }
#toggleBanner:hover { background:#555; color:#fff; }

/* 固定リンクバー */
#fixedLink {
  position: sticky;
  top: 0;
  z-index: 1000;
  background:#1f1f1f;
  padding:0.5rem 1rem;
  text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
}
#fixedLink a {
  color:#ddd;
  text-decoration:none;
  padding:0.3rem 0.8rem;
  border-radius:6px;
  background:#444;
  transition:0.3s;
}
#fixedLink a:hover { background:#555; color:#fff; }

/* セクション */
section { max-width:1000px; margin:2rem auto; padding:0 1rem; text-align:center; }
section h2 { font-size:1.8rem; margin-bottom:1rem; color:#aaa; }

/* 自己紹介 */
#profile p { margin:0.5rem auto; max-width:700px; color:#ccc; }

/* ポートフォリオカード */
.work-card { background:#1f1f1f; padding:1rem; border-radius:8px; text-align:center; margin-bottom:1rem; transition:0.3s; }
.work-card a { display:inline-block; margin-top:0.5rem; padding:0.5rem 1rem; background:#444; color:#ddd; text-decoration:none; border-radius:8px; }
.work-card a:hover { background:#555; color:#fff; }

footer { text-align:center; padding:2rem 1rem; color:#aaa; font-size:0.9rem; }
footer a { color:#888; text-decoration:underline; }

@media(max-width:768px){ section h2 { font-size:1.5rem; } }
</style>
</head>
<body>

<header>
<div id="bannerContainer">
<img id="bannerImg" data-img-desktop="https://hamusata.f5.si/banner_icon_hamusata.png"
                 data-img-mobile="https://m.hamusata.f5.si/banner_icon_hamusata.png"
                 alt="hamusata home banner">
</div>
<button id="toggleBanner">画像表示/非表示</button>
</header>

<!-- 上部固定リンク -->
<div id="fixedLink">
  <a href="https://hamusata.f5.si">通常版</a>
</div>

<section id="profile">
<h2>自己紹介</h2>
<p>こんにちは、hamusataです。軽量版では情報を最小限にしています。</p>
<p>詳細は通常版ホームページをご覧ください。</p>
<a href="https://hamusata.f5.si" style="display:inline-block;margin-top:0.8rem;padding:0.5rem 1rem;background:#444;color:#ddd;text-decoration:none;border-radius:6px;">通常版を見る</a>
</section>

<section id="portfolio">
<h2>簡易リンク</h2>
<div class="work-card">
<h3>ランダム作品</h3>
<a href="https://hamusata.f5.si/random">開く / Open</a>
</div>
</section>

<footer>
&copy; <span id="year"></span> HAMUSATA – Lite版 / All rights reserved.
</footer>

<script>
// 年自動更新
const baseYear = 2025;
const currentYear = new Date().getFullYear();
document.getElementById("year").textContent = currentYear > baseYear ? `${baseYear}~${currentYear}` : `${baseYear}`;

// バナー表示/非表示
document.getElementById('toggleBanner').addEventListener('click', () => {
  const banner = document.getElementById('bannerImg');
  if(banner.src) {
    banner.src = '';
  } else {
    const isMobile = window.innerWidth <= 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    banner.src = isMobile ? banner.dataset.imgMobile : banner.dataset.imgDesktop;
  }
});
</script>

</body>
</html>
