<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HAMUSATA Lite</title>
<style>
body {
  margin:0;
  padding:0;
  font-family:sans-serif;
  background:#121212;
  color:#ddd;
  line-height:1.4;
}
header {
  position:sticky;
  top:0;
  background:#121212;
  text-align:center;
  padding:0.5rem;
  font-weight:bold;
}
section {
  max-width:600px;
  margin:1rem auto;
  padding:0 0.5rem;
}
h2 {
  text-align:center;
  color:#aaa;
  font-size:1.5rem;
  margin:0.5rem 0;
}
p {
  text-align:center;
  margin:0.3rem 0;
}
a {
  color:#ddd;
  text-decoration:none;
  background:#444;
  padding:0.3rem 0.6rem;
  border-radius:4px;
  display:inline-block;
  margin-top:0.3rem;
}
a:hover {
  background:#555;
  color:#fff;
}
.works {
  display:grid;
  grid-template-columns:1fr;
  gap:0.5rem;
  margin-top:0.5rem;
}
.work-card {
  background:#1f1f1f;
  padding:0.5rem;
  border-radius:6px;
  text-align:center;
}
footer {
  text-align:center;
  color:#888;
  font-size:0.8rem;
  margin:1rem 0;
}
</style>
</head>
<body>

<header>HAMUSATA Lite</header>

<section id="profile">
<h2>自己紹介 / About Me</h2>
<p>Hello, I am hamusata. I create websites and explore the web.</p>
<p>I have a pet hamster.</p>
</section>

<section id="links">
<h2>リンク集 / Links</h2>
<div class="works">
<div class="work-card">
<h3>hamuzon.github.io</h3>
<p>GitHub Pages homepage.</p>
<a href="https://hamuzon.github.io">Open</a>
</div>
<div class="work-card">
<h3>home.hamusata.f5.si</h3>
<p>Main HAMUSATA portal.</p>
<a href="https://home.hamusata.f5.si">Open</a>
</div>
<div class="work-card">
<h3>www.link-s.f5.si</h3>
<p>Shortcut link collection.</p>
<a href="https://www.link-s.f5.si/">Open</a>
</div>
</div>
</section>

<footer>&copy;<span id="year"></span> HAMUSATA Lite</footer>

<script>
const y=new Date().getFullYear();
document.getElementById("year").textContent=y>2025?"2025~"+y:"2025";

function redirectLite() {
  const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||window.innerWidth<=768;
  const host=window.location.host;
  if(host!=="lite.hamusata.f5.si" && host!=="m-lite.hamusata.f5.si") return;
  if((isMobile && host==="m-lite.hamusata.f5.si") || (!isMobile && host==="lite.hamusata.f5.si")) return;
  window.location.href=isMobile?"https://m-lite.hamusata.f5.si":"https://lite.hamusata.f5.si";
}
window.addEventListener("load",redirectLite);
window.addEventListener("resize",redirectLite);
window.addEventListener("orientationchange",redirectLite);
</script>

</body>
</html>
