<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="apple-mobile-web-app-title" content="HAMUSATA Lite">

  <link rel="canonical" href="https://www.lite.hamusata.f5.si/s/">
  <link rel="apple-touch-icon" href="/favicon.ico">

  <meta property="og:title" content="HAMUSATA Lite | 最小版">
  <meta property="og:description" content="hamusata サイト最小版">
  <meta property="og:url" content="https://www.lite.hamusata.f5.si/s/">
  <meta property="og:site_name" content="HAMUSATA Lite">
  <title>HAMUSATA Lite | 最小版</title>

  <style>
    :root {
      --color-bg: #f5f5f5;
      --color-text: #333333;
      --color-h2: #555555;
      --color-link: #007acc;
      --color-link-hover: #005f99;
      --color-footer: #777777;
      --color-card: #ffffff;
      --color-border: #dddddd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121212;
        --color-text: #dddddd;
        --color-h2: #aaaaaa;
        --color-link: #4da6ff;
        --color-link-hover: #1a5fff;
        --color-footer: #888888;
        --color-card: #181818;
        --color-border: #303030;
      }
    }

    body {
      margin: 0;
      padding: 0 0.75rem;
      font-family: "Potta One", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6; 
    }

    section {
      max-width: 600px;
      margin: 1rem auto;
      padding: 1rem;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: 12px;
    }

    h2 {
      text-align: center;
      color: var(--color-h2);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    p {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 0.95rem; 
    }

    a {
      color: var(--color-link);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s ease, background 0.2s ease;
    }

    a:hover {
      color: var(--color-link-hover);
    }

    section p a {
      display: inline-block;
      padding: 0.35rem 0.6rem;
      border-radius: 8px;
    }

    section p a:hover {
      background: rgba(125, 125, 125, 0.12);
    }

    footer {
      text-align: center;
      color: var(--color-footer);
      padding: 1.5rem 1rem 2rem;
      font-size: 0.8rem;
    }

    .text-center {
      text-align: center;
    }

    .divider {
      max-width: 300px;
      border-color: var(--color-footer);
      opacity: 0.5;
    }

    @media (max-width: 480px) {
      body {
        padding: 0 0.5rem;
      }

      section {
        margin: 0.75rem auto;
        padding: 0.9rem;
      }
    }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
</head>

<body>

  <section>
    <h2>hamusata WEB lite</h2>
    <p>こんにちは、hamusataです。</p>
    <p>Web制作やネット閲覧等をしています。</p>
    <p>ハムスターが好きな人。</p>
    <p>
      <a href="https://hamusata.f5.si">通常版</a> |
      <a href="/">軽量版</a>
    </p>
  </section>

  <hr class="divider">

  <section>
    <h2>Links</h2>
    <p><a href="https://hamuzon.github.io">hamuzon.github.io</a></p>
    <p><a href="https://home.hamusata.f5.si">home.hamusata.f5.si</a></p>
    <p><a href="https://www.link-s.f5.si/">www.link-s.f5.si</a></p>
  </section>

  <footer>
    &copy; <span id="year"></span> HAMUSATA Lite
  </footer>

  <script>
    (function() {
      const baseYear = 2025;
      const currentYear = new Date().getFullYear();
      document.getElementById("year").textContent =
        currentYear > baseYear ? `${baseYear}~${currentYear}` : baseYear;
    })();
  </script>

  <script>
    function checkRedirect() {
      const isMobile =
        /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
        window.innerWidth <= 768;

      const host = window.location.host;
      const normalizedHost = host.toLowerCase();
      const isHamusataSubdomain = normalizedHost.endsWith('.hamusata.f5.si');

      if (!isHamusataSubdomain) {
        return;
      }

      const targetDesktop = 'www.lite.hamusata.f5.si';
      const targetMobile = 'www.m.lite.hamusata.f5.si';

      const expectedHost = isMobile ? targetMobile : targetDesktop;

      if (normalizedHost === expectedHost.toLowerCase()) {
        return;
      }

      const path = window.location.pathname +
                   window.location.search +
                   window.location.hash;

      const targetURL = 'https://' + expectedHost + path;

      window.location.replace(targetURL);
    }

    window.addEventListener('load', checkRedirect);
    window.addEventListener('resize', checkRedirect);
    window.addEventListener('orientationchange', checkRedirect);
  </script>


  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {
          /* no-op */
        });
      });
    }
  </script>

</body>
</html>
