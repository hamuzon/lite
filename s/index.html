<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hamusata WEB lite</title>

  <style>
    :root {
      --color-bg: #f5f5f5;
      --color-text: #333333;
      --color-h2: #555555;
      --color-link: #007acc;
      --color-link-hover: #005f99;
      --color-footer: #777777;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121212;
        --color-text: #dddddd;
        --color-h2: #aaaaaa;
        --color-link: #4da6ff;
        --color-link-hover: #1a5fff;
        --color-footer: #888888;
      }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.6; 
    }

    section {
      max-width: 600px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    h2 {
      text-align: center;
      color: var(--color-h2);
      font-size: 1.5rem;
      margin-bottom: 1rem;
      font-weight: 500;
    }

    p {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 0.95rem; 
    }

    a {
      color: var(--color-link);
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.3s ease;
    }

    a:hover {
      color: var(--color-link-hover);
    }

    footer {
      text-align: center;
      color: var(--color-footer);
      padding: 2rem 1rem;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>

  <section>
    <h2>hamusata WEB lite</h2>
    <p>こんにちは、hamusataです。</p>
    <p>Web制作やネット閲覧等をしています。</p>
    <p>ハムスターを飼っています。</p>
    <p>
      <a href="https://www.hamusata.f5.si">通常版</a> |
      <a href="https://www.lite.hamusata.f5.si">軽量版</a>
    </p>
  </section>

  <hr style="max-width: 300px; border-color: var(--color-footer); opacity: 0.5;">

  <section>
    <h2>Links</h2>
    <p><a href="https://hamuzon.github.io">hamuzon.github.io</a></p>
    <p><a href="https://home.hamusata.f5.si">home.hamusata.f5.si</a></p>
    <p><a href="https://www.link-s.f5.si/">www.link-s.f5.si</a></p>
  </section>

  <footer>
    &copy; <span id="year"></span> HAMUSATA Lite
  </footer>

  <script>
    (function() {
      const baseYear = 2025;
      const currentYear = new Date().getFullYear();
      document.getElementById("year").textContent =
        currentYear > baseYear ? `${baseYear}~${currentYear}` : baseYear;
    })();
  </script>

  <script>
    function checkRedirect() {
      const isMobile =
        /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
        window.innerWidth <= 768;

      const host = window.location.host;
      const isHamusataDomain = host.toLowerCase().includes('hamusata.f5.si');

      if (!isHamusataDomain) {
        return;
      }

      const targetDesktop = 'www.lite.hamusata.f5.si';
      const targetMobile = 'www.m.lite.hamusata.f5.si';

      const expectedHost = isMobile ? targetMobile : targetDesktop;

      if (host.toLowerCase() === expectedHost.toLowerCase()) {
        return;
      }

      const path = window.location.pathname +
                   window.location.search +
                   window.location.hash;

      const targetURL = 'https://' + expectedHost + path;

      window.location.replace(targetURL);
    }

    window.addEventListener('load', checkRedirect);
    window.addEventListener('resize', checkRedirect);
    window.addEventListener('orientationchange', checkRedirect);
  </script>

</body>
</html>
